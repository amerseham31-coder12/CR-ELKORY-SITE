<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR EL KORY — Quality Automotive Aftermarket Parts</title>
<meta name="description" content="CR EL KORY imports, distributes and sells high-quality aftermarket auto parts — suspension, electrical, mechanical and cooling — with delivery across all governorates of Egypt.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ice:#EAF3FB;--ice2:#D7E8F7;--silver:#C3CFDB;--chrome:linear-gradient(135deg,#fff 0%,#cfd9e4 38%,#f5f8fb 52%,#aebccb 100%);--navy:#0E2447;--blue:#4C9BE0;--mut:#5A6B84;--f:'Outfit','Segoe UI',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.1,1);--c1:#fff;--c2:#DDE9F5}
html[lang=ar]{--f:'Cairo','Segoe UI',Tahoma,sans-serif}html[lang=ar] *{letter-spacing:0!important}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--navy);font:400 16px/1.7 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=ar] body{line-height:1.85}
img,video{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.skip{position:fixed;top:-60px;inset-inline-start:12px;z-index:120;background:var(--navy);color:#fff;padding:8px 14px;border-radius:10px}.skip:focus{top:12px}
.wrap{width:min(1280px,100% - 48px);margin-inline:auto}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3,h4{margin:0;font-weight:300;line-height:1.08;letter-spacing:-.02em}h2{font-size:clamp(30px,4.4vw,64px)}b{font-weight:700}html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{line-height:1.25}
.kick{color:var(--blue);font-weight:600;font-size:14px;margin:0 0 14px}.mut{color:var(--mut);max-width:58ch}
section{position:relative}.pad{padding:clamp(70px,10vw,140px) 0}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:99px;font-weight:600;font-size:15px;transition:transform .3s var(--ease),box-shadow .3s}
.btn.p{background:var(--navy);color:#fff;box-shadow:0 10px 30px -10px rgba(14,36,71,.6)}.btn.g{background:var(--chrome);border:1px solid var(--silver)}.btn:hover{transform:translateY(-2px)}
#ld{position:fixed;inset:0;z-index:100;background:var(--ice);display:grid;place-items:center;transition:opacity .7s .2s,visibility .7s .2s}#ld.off{opacity:0;visibility:hidden}
#ld img{width:min(420px,70vw);clip-path:inset(0 100% 0 0);animation:wipe 1.1s var(--ease) .1s forwards}@keyframes wipe{to{clip-path:inset(0)}}
#wipe{position:fixed;inset:0;z-index:90;background:var(--wc,#0E2447);transform:translateY(101%);pointer-events:none;transition:transform .45s var(--ease)}#wipe.on{transform:none}#wipe.out{transform:translateY(-101%)}
/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:60;padding:14px 0;transition:.4s}.nav.s{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(14,36,71,.08);padding:8px 0}
.nav .wrap{display:flex;align-items:center;gap:22px}.nav .logo{width:140px}
.links{display:flex;align-items:center;gap:24px;margin-inline-start:auto;font-size:14.5px;font-weight:500}
.links>a,.dd>button{color:var(--mut);padding:6px 0;transition:color .2s}.links>a:hover,.links a.on,.dd:hover>button{color:var(--navy)}
.dd{position:relative}.dd .pn{position:absolute;inset-inline-start:-16px;top:100%;min-width:240px;padding:10px;border-radius:18px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 30px 50px -24px rgba(14,36,71,.4);opacity:0;visibility:hidden;transform:translateY(8px);transition:.3s var(--ease)}
.dd:hover .pn,.dd:focus-within .pn{opacity:1;visibility:visible;transform:none}.pn a{display:block;padding:10px 14px;border-radius:12px;color:var(--navy)}.pn a:hover{background:var(--ice)}
.pill{background:var(--navy);color:#fff!important;padding:9px 18px!important;border-radius:99px}
.lang{display:flex;border:1px solid var(--silver);border-radius:99px;padding:3px;background:#fff}.lang button{padding:3px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut)}.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.burger{display:none;width:42px;height:42px;position:relative}.burger i{position:absolute;inset-inline:10px;height:2px;background:var(--navy);transition:.3s}.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:21px}.burger i:nth-child(3){top:27px}
.burger[aria-expanded=true] i:nth-child(1){top:21px;transform:rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){opacity:0}.burger[aria-expanded=true] i:nth-child(3){top:21px;transform:rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:55;background:var(--ice);padding:100px 28px 30px;display:flex;flex-direction:column;gap:4px;clip-path:circle(0 at calc(100% - 40px) 36px);transition:clip-path .7s var(--ease);visibility:hidden}
html[dir=rtl] .menu{clip-path:circle(0 at 40px 36px)}.menu.open{clip-path:circle(150% at 50% 20%);visibility:visible}
.menu a{font-size:clamp(26px,8vw,40px);font-weight:300;padding:6px 0;opacity:0;transform:translateY(16px);transition:.5s var(--ease)}.menu.open a{opacity:1;transform:none}.menu small{color:var(--blue);font-weight:600;margin-top:12px}
/* hero */
.hero{min-height:100svh;display:grid;align-items:center;padding:120px 0 70px;background:radial-gradient(900px 600px at 78% 45%,#fff 0,var(--ice) 55%,var(--ice2) 100%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,80px)}.hero h1 span{display:block;overflow:hidden;padding-bottom:.08em}.hero h1 i{display:block;font-style:normal;transform:translateY(110%);transition:transform 1.1s var(--ease)}body.go .hero h1 i{transform:none}body.go .hero h1 span+span i{transition-delay:.14s}
.hero .brandline{font-weight:600;letter-spacing:.06em;color:var(--blue);margin:0 0 18px}.hero .lead{max-width:46ch;color:var(--mut);font-size:clamp(16px,1.4vw,19px);margin:24px 0 8px}.hero .flow{font-weight:600;font-size:14px;margin:0 0 30px}
.fd{opacity:0;transform:translateY(18px);transition:1s var(--ease)}body.go .fd{opacity:1;transform:none;transition-delay:.5s}
.lens{position:relative;aspect-ratio:1;width:min(100%,520px);margin-inline:auto;border-radius:50%;padding:12px;background:var(--chrome);box-shadow:0 50px 90px -30px rgba(14,36,71,.45)}
.lens video{width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid var(--navy)}.lens::before{content:"";position:absolute;inset:-30px;border-radius:50%;border:1px dashed rgba(14,36,71,.22);animation:spin 60s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lens::after{content:"";position:absolute;inset:12px;border-radius:50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 5s ease-in-out infinite;pointer-events:none}@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
/* scenes */
.scene{height:280vh}.stk{position:sticky;top:0;height:100svh;overflow:hidden}
.doors .stk{background:radial-gradient(800px 600px at 50% 50%,#fff,var(--ice))}
.door{position:absolute;top:0;bottom:0;width:50.4%;z-index:5;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(14,36,71,.06) 0 2px,transparent 2px 30px),linear-gradient(100deg,#f4f7fb,#cfd9e4 45%,#eef3f8 55%,#aebccb);box-shadow:0 0 60px rgba(14,36,71,.25)}
.door.l{left:0;transform:translateX(calc(var(--q,0)*-105%))}.door.r{right:0;transform:translateX(calc(var(--q,0)*105%))}
.door img{position:absolute;top:50%;width:var(--lw);transform:translateY(-50%)}.door.l img{left:calc(50vw - var(--lw)/2)}.door.r img{left:calc(.4vw - var(--lw)/2)}
.doors{--lw:min(60vw,620px)}.door::after{content:"";position:absolute;top:30%;bottom:30%;width:8px;border-radius:6px;background:var(--navy);opacity:.55}.door.l::after{right:18px}.door.r::after{left:18px}
.dstage{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4vw;padding:0 6vw}
.fr{height:min(82vh,calc(46vw*16/9));aspect-ratio:9/16;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 50px 80px -30px rgba(14,36,71,.5);position:relative;transform:scale(calc(.9 + var(--q,0)*.1))}.fr video{width:100%;height:100%;object-fit:cover}

.dstage h2{margin:6px 0 14px}.dtx{opacity:calc(var(--q,0)*1.4 - .4);transform:translateY(calc((1 - var(--q,0))*30px))}
/* journey */
.jr .stk{background:linear-gradient(var(--ice),#fff)}.jgrid{height:100%;display:grid;grid-template-columns:1fr auto;gap:6vw;align-items:center;padding:0 6vw;max-width:1280px;margin:auto}
.stp{display:flex;flex-direction:column;gap:6px}.stp div{padding:18px 0;border-top:1px solid var(--silver);opacity:.35;transition:.5s var(--ease)}.stp b{font-size:clamp(26px,3.6vw,50px);font-weight:300;display:block;line-height:1.1}.stp small{color:var(--mut);font-size:15px}
.jr[data-s="0"] .stp div:nth-child(1),.jr[data-s="1"] .stp div:nth-child(2),.jr[data-s="2"] .stp div:nth-child(3),.jr[data-s="3"] .stp div:nth-child(4){opacity:1;border-color:var(--blue);padding-inline-start:18px}
.jr .fr{transform:none}.jr .fr video{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.jr[data-s="0"] video.a,.jr[data-s="1"] video.b,.jr[data-s="2"] video.c,.jr[data-s="3"] video.c{opacity:1}
/* gateway */
.gw{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:48px}
.gt{grid-column:span 6;position:relative;overflow:hidden;border-radius:32px;min-height:clamp(360px,44vw,520px);padding:30px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(140deg,var(--c1),var(--c2));border:1px solid var(--ice2);transition:transform .6s var(--ease),box-shadow .6s}
.gt:nth-child(2){margin-top:44px}.gt:nth-child(3){margin-top:-44px}.gt:hover{transform:translateY(-8px);box-shadow:0 40px 60px -34px rgba(14,36,71,.5)}
.gt .env{opacity:.7}.gt img{position:absolute;inset-inline-end:6%;top:8%;max-height:56%;max-width:64%;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(14,36,71,.28));transition:transform .8s var(--ease)}.gt:hover img{transform:scale(1.08) rotate(-2deg)}
.gt small{font-size:clamp(50px,6vw,90px);font-weight:200;color:var(--blue);line-height:1;position:relative}.gt h3{font-size:clamp(28px,3.4vw,48px);position:relative}.gt .ar2{font-family:'Cairo',sans-serif;font-weight:700;font-size:20px;position:relative}.gt p{margin:6px 0 0;color:var(--mut);position:relative}
.c-susp{--c1:#fff;--c2:#DDE9F5}.c-elec{--c1:#F4FAFF;--c2:#CFE4FA}.c-mech{--c1:#fff;--c2:#D9DEE5}.c-cool{--c1:#F6FCFF;--c2:#D2EDFB}
.env{position:absolute;inset:0;pointer-events:none;overflow:hidden}.env svg{position:absolute;width:100%;height:100%}.env .ln{fill:none;stroke:#9FB2C7;stroke-width:1.4;opacity:.55}.env .ln.b{stroke:var(--blue);opacity:.7;stroke-width:2}
.env .dr{animation:drift 14s linear infinite}.env .dr.s{animation-duration:22s;opacity:.4}@keyframes drift{to{transform:translateX(-300px)}}
.env .dash{stroke-dasharray:140 1100;animation:dash 7s linear infinite}@keyframes dash{to{stroke-dashoffset:-1240}}
.env .gear{fill:none;stroke:#B9C4D1;stroke-width:34;stroke-dasharray:22 14;opacity:.4;transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}.env .gear.r{animation-direction:reverse;animation-duration:50s}
/* bands */
.band{border-radius:36px;padding:clamp(32px,5vw,72px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;background:var(--navy);color:#fff}.band h2{max-width:16ch;color:#fff}.band .mut{color:#B6C6DD}
.band.ice{background:linear-gradient(135deg,var(--ice),var(--ice2));color:var(--navy)}.band.ice h2{color:var(--navy)}.band.ice .mut{color:var(--mut)}.band .btn.p{background:#fff;color:var(--navy)}.band.ice .btn.p{background:var(--navy);color:#fff}
/* about */
.tl{position:relative;padding-inline-start:44px;max-width:760px}.tl::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--ice2)}
.tl article{position:relative;padding-bottom:56px}.tl article::before{content:"";position:absolute;inset-inline-start:-44px;top:10px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--silver);transition:.5s}.tl article.in::before{border-color:var(--navy);background:var(--blue);box-shadow:0 0 0 6px rgba(76,155,224,.18)}
.tl .yr{font-size:clamp(36px,5vw,68px);font-weight:200;line-height:1;margin-bottom:8px;unicode-bidi:isolate;direction:ltr;text-align:start}.tl h3{font-size:21px;font-weight:600;margin-bottom:4px}.tl p{margin:0;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}.cols>div{border-top:2px solid var(--navy);padding-top:18px}.cols h3{font-size:22px;font-weight:600;margin-bottom:8px}.cols p{margin:0;color:var(--mut)}
/* category page */
.cover{position:relative;min-height:62svh;display:flex;align-items:flex-end;padding:150px 0 50px;background:linear-gradient(120deg,var(--c1),var(--c2));overflow:hidden}.cover .wrap{position:relative}
.cover small{font-size:clamp(60px,10vw,150px);font-weight:200;color:var(--blue);line-height:1;display:block}.cover h1{font-size:clamp(40px,7.4vw,118px);font-weight:300}.cover .ar2{font-family:'Cairo',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,46px);margin:6px 0 14px}
.ex{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:clamp(24px,4vw,64px);padding:60px 0 20px}
.idx{display:flex;flex-direction:column;position:sticky;top:96px;align-self:start}.idx button{display:flex;gap:14px;align-items:baseline;padding:13px 4px;border-bottom:1px solid var(--ice2);color:var(--mut);transition:.3s var(--ease);font-size:17px}
.idx button i{font-style:normal;font-size:12px;color:var(--blue);min-width:22px;direction:ltr}.idx button:hover,.idx button[aria-current=true]{color:var(--navy);padding-inline-start:14px;border-color:var(--blue)}.idx button[aria-current=true]{font-weight:600}.idx .ph{margin-inline-start:auto;font-size:11px;color:var(--silver)}
.stg{position:relative;min-height:62vh;border-radius:34px;background:radial-gradient(circle at 50% 42%,#fff,var(--ice));border:1px solid var(--ice2);overflow:hidden;display:grid;place-items:center;padding:30px}
.stg .gh{position:absolute;inset-inline:0;top:44%;text-align:center;white-space:nowrap;font-size:clamp(60px,10vw,160px);font-weight:700;color:transparent;-webkit-text-stroke:1.5px rgba(14,36,71,.12);transform:translateY(-50%);line-height:1;overflow:hidden}
.stg .im{position:relative;z-index:2;display:grid;place-items:center;animation:pin .7s var(--ease)}@keyframes pin{from{opacity:0;transform:translateY(24px) scale(.96)}}
.stg img.main{max-height:46vh;max-width:min(100%,640px);object-fit:contain;filter:drop-shadow(0 36px 34px rgba(14,36,71,.28));transition:transform .5s var(--ease)}
.thumbs{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}.thumbs button{width:54px;height:54px;border:1.5px solid var(--silver);border-radius:12px;background:#fff;padding:4px}.thumbs button[aria-current=true]{border-color:var(--navy)}.thumbs img{width:100%;height:100%;object-fit:contain}
.nop{position:relative;z-index:2;text-align:center;color:var(--mut);display:grid;gap:14px;place-items:center}.nop i{width:180px;aspect-ratio:1.3;border:1.5px dashed var(--silver);border-radius:22px;display:block}
.cap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-top:20px}.cap h3{font-size:clamp(24px,3vw,42px);font-weight:600}.cap .ar2{font-family:'Cairo',sans-serif;color:var(--blue);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{padding:7px 14px;border-radius:99px;border:1px solid var(--silver);background:#fff;font-size:14px;font-weight:500}
.nx{display:flex;justify-content:space-between;gap:16px;padding:40px 0;border-top:1px solid var(--ice2);margin-top:50px;flex-wrap:wrap}
/* product page */
.pp{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,70px);padding:120px 0 40px;align-items:center;min-height:100svh}
.pp .stg{min-height:70vh}.pp .info h1{font-size:clamp(34px,4.6vw,66px);font-weight:600;margin:6px 0}.pp .info .ar2{font-family:'Cairo',sans-serif;color:var(--blue);font-weight:600;font-size:26px;margin-bottom:20px}.pp .info h4{font-size:14px;font-weight:600;margin:22px 0 10px;color:var(--mut)}
.pp .cn a{color:var(--blue);font-weight:600}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:860px}.form .f{display:flex;flex-direction:column;gap:6px}.form .f.w{grid-column:1/-1}
.form label{font-size:14px;font-weight:600}.form input,.form select,.form textarea{font:inherit;padding:14px 16px;border-radius:14px;border:1.5px solid var(--silver);background:#fff;color:var(--navy);width:100%;text-align:start}.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(76,155,224,.15)}
.form .note{grid-column:1/-1;font-size:14px;color:var(--mut)}
.err{color:#b3261e;font-size:13px;min-height:1em}
/* videos/contact */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,3vw,40px);margin-top:48px}.vgrid .fr{height:auto;width:100%;transform:none}.vgrid figcaption{margin-top:14px;font-weight:600}.vgrid figure{margin:0}.vgrid figure:nth-child(2){margin-top:60px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.num{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-radius:20px;background:var(--ice);border:1px solid #fff}.num a:first-child{font-size:22px;font-weight:600;direction:ltr}.num a:last-child{font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff}
.brs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.brs div{padding:22px 26px;border-radius:20px;border:1px solid var(--ice2)}.brs b{display:block;margin-bottom:4px}
footer{background:var(--navy);color:#B6C6DD;padding:56px 0 30px;font-size:14.5px}footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}footer h4{color:#fff;font-size:15px;font-weight:600;margin-bottom:12px;letter-spacing:0}footer a{display:block;padding:3px 0}footer a:hover{color:#fff}footer .logo{width:150px;filter:brightness(0) invert(1);margin-bottom:12px}
.fb{display:inline-flex!important;align-items:center;gap:10px;padding:10px 18px!important;border-radius:99px;background:#1877F2;color:#fff!important;font-weight:600}.fb svg{width:18px;height:18px;fill:#fff}
.copy{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ===== v4 additions ===== */
.vf{position:relative}.vc{position:absolute;inset-inline:10px;bottom:10px;display:flex;align-items:center;gap:6px;z-index:8;padding:6px;border-radius:99px;background:rgba(10,22,45,.5);backdrop-filter:blur(10px);color:#fff}
.vc button{min-width:38px;height:38px;border-radius:99px;color:#fff;text-align:center;font-size:15px;line-height:1}.vc button:hover{background:rgba(255,255,255,.2)}
.vc .snd{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);white-space:nowrap}.vc .snd.off{animation:pls 2.2s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%,100%{box-shadow:0 0 0 12px transparent}}

<div class="nl">${PH.map((n,i)=>`<div class="nr rv"><span class="ix">0${i+1}</span><a href="tel:+2${n}" aria-label="${t('Call','اتصل')} ${n}">${rollNum(n)}<span class="sr">${n}</span></a><div class="ac"><a class="btn p" href="tel:+2${n}">${t('Call','اتصل')}</a><a class="btn g" target="_blank" rel="noopener" href="https://wa.me/2${n}">${t('WhatsApp','واتساب')}</a></div></div>`).join('')}</div>
<div class="addr rv"><div class="pinw">${ICN.pin}</div><div style="flex:1"><h3>${t('Our address','عنواننا')}</h3><p>${ADDR()}</p></div><a class="btn g" target="_blank" rel="noopener" href="${MAPS}">${t('Open in Google Maps','افتح في خرائط جوجل')}</a></div>
<div class="row"><a class="fb" target="_blank" rel="noopener" href="${FB}">${FBI}${t('Our Facebook page','صفحتنا على فيسبوك')}</a><a class="btn g" href="#price">${t('Request price list','اطلب كشف الأسعار')}</a></div></div></section>`}};
/* ---------- chrome ---------- */
function chrome(){const k=(h,a,e,x)=>`<a href="#${h}" data-r="${h}" ${x||''}>${t(e,a)}</a>`;
 $('#links').innerHTML=k('home','الرئيسية','Home')+k('about','من نحن','About Us')+`<div class="dd"><button type="button" aria-haspopup="true">${t('Products','المنتجات')} ▾</button><div class="pn">${CATS.map(c=>`<a href="#c-${c.id}">${nm(c)}</a>`).join('')}</div></div>`+k('videos','فيديوهات الشركة','Real Videos')+k('contact','تواصل معنا','Contact Us')+`<a class="pill" href="#price">${t('Request Price List','اطلب كشف الأسعار')}</a>`;
 $('#menu').innerHTML=[['home','الرئيسية','Home'],['about','من نحن','About Us']].map(a=>k(...a)).join('')+`<small>${t('Products','المنتجات')}</small>`+CATS.map(c=>`<a href="#c-${c.id}">${nm(c)}</a>`).join('')+k('videos','فيديوهات الشركة','Real Videos')+`<a href="#price">${t('Request Price List','اطلب كشف الأسعار')}</a>`+k('contact','تواصل معنا','Contact Us');
 $$('.menu a').forEach((a,i)=>a.style.transitionDelay=(i*.04+.2)+'s');
 $('#ft').innerHTML=`<div class="wrap"><div class="g"><div><img class="logo" src="${asset('logo.png')}" alt="CR EL KORY"><div>${t('High-quality aftermarket auto parts. Importation, distribution, wholesale and retail.','قطع غيار سيارات عالية الجودة (أفترماركت). استيراد وتوزيع وجملة وتجزئة.')}</div><div style="margin-top:14px">${ADDR()}</div></div>
 <div><h4>${t('Products','المنتجات')}</h4>${CATS.map(c=>`<a href="#c-${c.id}">${nm(c)}</a>`).join('')}</div>
 <div><h4>${t('Company','الشركة')}</h4><a href="#about">${t('About Us','من نحن')}</a><a href="#videos">${t('Real Videos','فيديوهات الشركة')}</a><a href="#price">${t('Request Price List','اطلب كشف الأسعار')}</a><a href="#contact">${t('Contact Us','تواصل معنا')}</a></div>
 <div><h4>${t('Contact','تواصل')}</h4>${PH.map(n=>`<a href="tel:+2${n}"><span class="ltr">${n}</span></a>`).join('')}<a class="fb" target="_blank" rel="noopener" href="${FB}" style="margin-top:10px">${FBI}Facebook</a></div></div>
 <div class="copy"><span>© CR EL KORY</span><span>${t('Product-specific warranty — coverage varies by category.','الضمان حسب المنتج — تختلف التغطية من فئة لأخرى.')}</span></div></div>`;
 $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==L));$$('[data-a]').forEach(e=>e.src=asset(e.dataset.a))}
/* ---------- router ---------- */
let cur='',busy=0,queued=0;
function parse(){const h=(location.hash||'#home').slice(1);let m;
 if(m=h.match(/^c-(susp|elec|mech|cool)$/))return{k:'cat',a:[m[1]],col:m[1]};
 if(m=h.match(/^p-(susp|elec|mech|cool)-(.+)$/)){const c=cat(m[1]);if(c.p.some(p=>p.slug==m[2]))return{k:'prod',a:[m[1],m[2]],col:m[1]}}
 if(m=h.match(/^price(?:-(susp|elec|mech|cool))?$/))return{k:'price',a:[m[1]]};
 if(['about','videos','contact'].includes(h))return{k:h,a:[]};return{k:'home',a:[]}}
function render(){const r=parse();const f=pages[r.k=='cat'?'cat':r.k=='prod'?'prod':r.k];$('#app').innerHTML=f(...r.a);splitWords();
 document.title='CR EL KORY — '+t('Quality Automotive Aftermarket Parts','قطع غيار سيارات عالية الجودة');
 $$('.links a').forEach(a=>a.classList.toggle('on',a.dataset.r==(r.k=='home'?'home':r.k)));bind(r);scrollTo({top:0,left:0,behavior:'instant'})}
function go(){if(busy){queued=1;return}const key=location.hash;if(!cur||RM){cur=key;render();return}
 busy=1;const w=$('#wipe'),r=parse();w.style.setProperty('--wc',WCOL[r.col]||'#0E2447');w.className='on';
 setTimeout(()=>{cur=key;render();w.className='out';setTimeout(()=>{w.className='';w.style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transition=''}));busy=0;if(queued){queued=0;go()}},460)},460)}
addEventListener('hashchange',go);
/* ---------- behaviours ---------- */
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}}),{threshold:.15});
const vo=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting&&!RM&&!v.dataset.up){v.play().catch(()=>{})}else v.pause()}),{threshold:.25});
function bind(r){$$('.rv').forEach(e=>ro.observe(e));$$('video[data-play]').forEach(v=>{vo.observe(v)});
 if(r.k=='prod'){const c=cat(r.a[0]),i=c.p.findIndex(p=>p.slug==r.a[1]);$('#stg').onclick=e=>{const g=e.target.closest('[data-g]');if(g)$('#stg').innerHTML=stage(c,i,+g.dataset.g)}}
 if(r.k=='price'){$('#pf').onsubmit=e=>{e.preventDefault();const v=id=>$('#'+id).value.trim();let ok=1;$('#e1').textContent=v('n')?'':(ok=0,t('Please enter your name','من فضلك اكتب اسمك'));
  $('#e2').textContent=/^[0-9+\s-]{8,}$/.test(v('ph'))?'':(ok=0,t('Please enter a valid phone number','من فضلك اكتب رقم تليفون صحيح'));if(!ok)return;
  const ct=v('ct'),cn=ct=='all'?t('All categories','كل الفئات'):nm(cat(ct));
  const m=t('Hello CR EL KORY, I would like to request your price list.\n','مرحباً الكوري، أود طلب كشف الأسعار.\n')+`${t('Name','الاسم')}: ${v('n')}\n`+(v('b')?`${t('Business','النشاط')}: ${v('b')}\n`:'')+`${t('Phone','التليفون')}: ${v('ph')}\n`+(v('w')?`WhatsApp: ${v('w')}\n`:'')+(v('ty')?`${t('Type','النوع')}: ${$('#ty').selectedOptions[0].text}\n`:'')+`${t('Category','الفئة')}: ${cn}`;
  window.open(wa(m),'_blank','noopener')}}
 frame()}
addEventListener('pointermove',e=>{if(RM||e.pointerType=='touch')return;const h=e.target.closest&&e.target.closest('.spi,.stg');if(!h)return;const f=h.querySelector('.fl');if(!f)return;const r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;f.style.animation='none';f.style.transform=`perspective(900px) rotateY(${(x-.5)*13}deg) rotateX(${-(y-.5)*9}deg) scale(1.035)`;f.style.setProperty('--mx',Math.round(x*100))});
addEventListener('pointerout',e=>{const h=e.target.closest&&e.target.closest('.spi,.stg');if(h&&!h.contains(e.relatedTarget)){const f=h.querySelector('.fl');if(f){f.style.transform='';f.style.animation=''}}});
let tk=0;function frame(){tk=0;const H=innerHeight,vw=innerWidth,rtl=document.documentElement.dir=='rtl';$('#nav').classList.toggle('s',scrollY>30);
 $$('[data-scene]').forEach(s=>{const r=s.getBoundingClientRect();if(r.bottom<-50||r.top>H+50)return;const p=RM?1:cl(-r.top/(s.offsetHeight-H));s.style.setProperty('--p',p.toFixed(4));s.style.setProperty('--q',cl(p*1.7).toFixed(4));s.dataset.s=Math.min(3,Math.floor(p*3.999))});
 $$('.cxs').forEach(s=>{const r=s.getBoundingClientRect();if(r.bottom<-60||r.top>H+60)return;const n=+s.dataset.n,p=cl(-r.top/(s.offsetHeight-H)),sp=p*(n-1),si=Math.floor(Math.min(sp,n-1.0001)),f=cl((sp-si-.28)/.44),xi=si+f*f*(3-2*f);
  s.querySelector('.tk').style.transform=`translate3d(${(rtl?1:-1)*xi*vw}px,0,0)`;s.querySelectorAll('.sl').forEach((sl,i)=>sl.style.setProperty('--d',((i-xi)*(rtl?-1:1)).toFixed(3)));
  s.querySelector('.pb b').style.transform=`scaleX(${p})`;const cu=Math.round(sp);s.dataset.cur=cu;s.querySelector('.ct').textContent=(cu+1)+'/'+n});
 $$('[data-words]').forEach(w=>{const r=w.getBoundingClientRect(),sp=[...w.children],k=Math.round(cl((H*.92-r.top)/(H*.5))*sp.length);sp.forEach((x,i)=>x.classList.toggle('on',i<k))});
 $$('.tl article,.strip article').forEach(a=>{if(a.getBoundingClientRect().top<H*.7)a.classList.add('in')});if(document.querySelector('.jr'))syncV()}
const req=()=>{if(!tk)tk=requestAnimationFrame(frame)};addEventListener('scroll',req,{passive:true});addEventListener('resize',req);
function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';try{localStorage.setItem('crk-l',l)}catch(e){}chrome();if(cur)render()}
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#bg').onclick=e=>{const o=$('#menu').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''};
$('#menu').onclick=e=>{if(e.target.closest('a')){$('#menu').classList.remove('open');$('#bg').setAttribute('aria-expanded',false);document.body.style.overflow=''}};
let sl;try{sl=localStorage.getItem('crk-l')}catch(e){}L=sl=='ar'?'ar':'en';document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';

function splitWords(){$$('[data-words]').forEach(e=>{e.innerHTML=e.textContent.trim().split(/\s+/).map(w=>`<span>${w}</span>`).join(' ')})}
const av=fr=>{const vs=[...fr.querySelectorAll('video')];if(vs.length<2)return vs[0];return vs.find(v=>+getComputedStyle(v).opacity>.5)||vs[0]};
function syncV(){$$('.vf').forEach(fr=>{const v=av(fr);if(!v)return;[...fr.querySelectorAll('video')].forEach(o=>{if(o!==v&&!o.muted)o.muted=true});const b=fr.querySelector('.snd'),pp=fr.querySelector('.pbtn'),vl=fr.querySelector('.vol');
 if(b){const on=!v.muted&&v.volume>0;b.classList.toggle('off',!on);b.setAttribute('aria-pressed',on);b.querySelector('.tx').textContent=on?t('Mute','كتم الصوت'):t('Sound on','شغّل الصوت');b.querySelector('.x').style.display=on?'none':'';b.querySelector('.w').style.display=on?'':'none'}
 if(pp)pp.textContent=v.paused?'▶':'❚❚';if(vl&&document.activeElement!==vl)vl.value=v.muted?0:v.volume})}
document.addEventListener('click',e=>{const b=e.target.closest('.vf .snd,.vf .pbtn,.vf .fs');if(!b)return;const fr=b.closest('.vf'),v=av(fr);if(!v)return;
 if(b.classList.contains('snd')){if(v.muted||v.volume==0){$$('video').forEach(o=>{if(o!==v)o.muted=true});v.muted=false;if(v.volume<.05)v.volume=1;delete v.dataset.up;v.play().catch(()=>{})}else v.muted=true}
 else if(b.classList.contains('pbtn')){if(v.paused){delete v.dataset.up;v.play().catch(()=>{})}else{v.dataset.up=1;v.pause()}}
 else{const f=fr.requestFullscreen||fr.webkitRequestFullscreen;if(f)f.call(fr);else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}syncV()});
document.addEventListener('input',e=>{const r=e.target.closest&&e.target.closest('.vf .vol');if(!r)return;const v=av(r.closest('.vf'));v.volume=+r.value;v.muted=+r.value==0;if(!v.muted)$$('video').forEach(o=>{if(o!==v)o.muted=true});syncV()});
['volumechange','play','pause'].forEach(ev=>document.addEventListener(ev,syncV,true));
function stepTrack(s,st){if(!s)return;const n=+s.dataset.n,k=cl((+s.dataset.cur||0)+st,0,n-1),top=scrollY+s.getBoundingClientRect().top;scrollTo({top:top+(k/(n-1))*(s.offsetHeight-innerHeight),behavior:'smooth'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){stepTrack(b.closest('.cxs'),+b.dataset.st);return}const sp=e.target.closest('.spi,.scp');if(sp){const sl=sp.closest('.sl'),s=sp.closest('.cxs');if(sl&&s&&sl.dataset.slug)location.hash='p-'+s.dataset.c+'-'+sl.dataset.slug}});
addEventListener('keydown',e=>{const s=$('.cxs');if(!s||!['ArrowLeft','ArrowRight'].includes(e.key)||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const rtl=document.documentElement.dir=='rtl';stepTrack(s,((e.key=='ArrowRight')!==rtl)?1:-1)});
if(!RM){const cu=document.createElement('div');cu.className='cur';document.body.appendChild(cu);let cx=0,cy=0,tx=0,ty=0;addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;tx=e.clientX;ty=e.clientY;cu.classList.add('v');cu.classList.toggle('h',!!e.target.closest('a,button,.spi,input,.vf'))});(function lp(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;cu.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(lp)})()}
chrome();cur=location.hash;render();
const done=()=>{$('#ld').classList.add('off');document.body.classList.add('go')};addEventListener('load',()=>setTimeout(done,1400));setTimeout(done,3500);
</script>
